# -----------------------------------------------------------------------------
#  Release pipeline for Glass.Message.
#
#  Fires either when you push a version tag with plain git:
#      git tag v1.2.3
#      git push origin v1.2.3        # <- the workflow CREATES the Release for you
#  ...or when you publish a Release from the GitHub UI. Either way the tag
#  (e.g. v1.2.3) becomes the package version.
#
#  Produces and attaches to the Release (so anyone can download from the repo's
#  Releases page — no NuGet account needed):
#    * Glass.Message.<ver>.nupkg     — one NuGet package containing ALL four
#                                      target frameworks (net481 + net8/9/10).
#    * Glass.Message.<ver>.snupkg    — debug symbols package.
#    * Glass.Message-<ver>-<tfm>.zip — raw DLL + XML docs per framework, for
#                                      people who want a single TFM directly.
#                                      (AnyCPU — runs on both x86 and x64.)
#    * Glass.Demo-<ver>-win-x64.zip   — runnable, self-contained demo (x64).
#    * Glass.Demo-<ver>-win-x86.zip   — runnable, self-contained demo (x86).
#
#  NOTE: runs on Windows because the library targets .NET Framework 4.8.1 and
#  Windows Forms, which only build on Windows.
# -----------------------------------------------------------------------------

name: Release

on:
  # A) Push a version tag with plain git — the workflow creates the Release:
  #      git tag v1.2.3 && git push origin v1.2.3
  push:
    tags:
      - "v*"
  # B) Or publish a Release from the GitHub UI.
  release:
    types: [published]
  # C) Manual run for testing (builds artifacts; does not touch a Release).
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (e.g. 1.2.3)"
        required: true

# Needed so the workflow can upload assets onto the Release.
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    env:
      Configuration: Release
      DOTNET_NOLOGO: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Install the modern .NET SDKs. .NET Framework 4.8.1's targeting pack is
      # already present on the windows-latest image.
      - name: Setup .NET SDKs (8 / 9 / 10)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      # Resolve the version (strip a leading "v") from whichever trigger fired:
      #   push tag     -> github.ref_name        (e.g. v1.2.3)
      #   release      -> release.tag_name
      #   manual run   -> the version input
      - name: Determine version
        id: ver
        shell: pwsh
        run: |
          switch ($env:GITHUB_EVENT_NAME) {
            'push'    { $v = '${{ github.ref_name }}' }
            'release' { $v = '${{ github.event.release.tag_name }}' }
            default   { $v = '${{ github.event.inputs.version }}' }
          }
          $v = $v -replace '^v', ''
          if ([string]::IsNullOrWhiteSpace($v)) { throw "Could not resolve a version." }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Building version $v"

      - name: Restore
        run: dotnet restore Glass.sln

      # Build only the library (all four TFMs at once via its <TargetFrameworks>).
      - name: Build library
        run: >
          dotnet build Glass.Message/Glass.Message.csproj
          --configuration Release
          --no-restore
          -p:Version=${{ steps.ver.outputs.version }}
          -p:ContinuousIntegrationBuild=true

      # Run the unit tests (net8.0-windows). A failure here stops the release.
      - name: Test
        run: >
          dotnet test Glass.Message.Tests/Glass.Message.Tests.csproj
          --configuration Release
          --no-restore

      # Produce the NuGet package (+ symbols). One .nupkg holds every TFM.
      - name: Pack NuGet package
        run: >
          dotnet pack Glass.Message/Glass.Message.csproj
          --configuration Release
          --no-build
          --output artifacts
          -p:Version=${{ steps.ver.outputs.version }}
          -p:PackageVersion=${{ steps.ver.outputs.version }}

      # Zip the built DLL + XML docs for each target framework individually, so
      # the Release page offers a direct per-framework download.
      - name: Package per-target-framework DLLs
        shell: pwsh
        run: |
          $ver  = '${{ steps.ver.outputs.version }}'
          $tfms = 'net481','net8.0-windows','net9.0-windows','net10.0-windows'
          $bin  = 'Glass.Message/bin/Release'
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          foreach ($t in $tfms) {
            $src = Join-Path $bin $t
            if (-not (Test-Path $src)) { Write-Warning "Missing output for $t ($src)"; continue }
            $wanted = 'Glass.Message.dll','Glass.Message.xml','Glass.Message.pdb'
            $files  = Get-ChildItem -Path $src -File | Where-Object { $wanted -contains $_.Name }
            if (-not $files) { Write-Warning "No files to zip for $t"; continue }
            $zip = "artifacts/Glass.Message-$ver-$t.zip"
            Compress-Archive -Path $files.FullName -DestinationPath $zip -Force
            Write-Host "Created $zip"
          }
          Write-Host "`nArtifacts so far:"
          Get-ChildItem artifacts | Format-Table Name, Length

      # Publish the demo gallery as a self-contained Windows app for BOTH
      # architectures, so anyone can download the matching zip, unzip, and run
      # Glass.Demo.exe WITHOUT installing .NET. (The library DLLs are AnyCPU and
      # already run on x86 and x64 — only the bundled runtime is per-arch.)
      - name: Publish demo app (self-contained, x64 + x86)
        shell: pwsh
        run: |
          $ver  = '${{ steps.ver.outputs.version }}'
          $rids = 'win-x64','win-x86'
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          foreach ($rid in $rids) {
            $out = "publish/demo-$rid"
            dotnet publish Glass.Demo/Glass.Demo.csproj `
              --configuration Release `
              --runtime $rid `
              --self-contained true `
              -p:PublishSingleFile=true `
              -p:IncludeNativeLibrariesForSelfExtract=true `
              -p:Version=$ver `
              --output $out
            Compress-Archive -Path "$out/*" `
              -DestinationPath "artifacts/Glass.Demo-$ver-$rid.zip" -Force
            Write-Host "Created artifacts/Glass.Demo-$ver-$rid.zip"
          }

      # Always keep the artifacts on the workflow run itself (handy for manual runs).
      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: glass-message-${{ steps.ver.outputs.version }}
          path: artifacts/*
          if-no-files-found: error

      # Pull the section for THIS version out of CHANGELOG.md so it becomes the
      # release description. This is what gives every tag proper, curated notes.
      - name: Extract release notes from CHANGELOG
        if: ${{ github.event_name == 'push' || github.event_name == 'release' }}
        shell: pwsh
        run: |
          $ver  = '${{ steps.ver.outputs.version }}'
          $path = 'CHANGELOG.md'
          $buf  = @()
          if (Test-Path $path) {
            $capture = $false
            foreach ($line in Get-Content $path) {
              if ($line -match '^##\s+\[') {
                if ($capture) { break }   # next version section -> stop
                if ($line -match "^##\s+\[$([regex]::Escape($ver))\]") { $capture = $true; continue }
              }
              if ($capture) { $buf += $line }
            }
          }
          $notes = ($buf -join "`n").Trim()
          if ([string]::IsNullOrWhiteSpace($notes)) {
            $notes = "Release v$ver. See CHANGELOG.md for details."
            Write-Warning "No CHANGELOG section found for $ver; using a fallback."
          }
          Set-Content -Path release-notes.md -Value $notes -Encoding utf8
          Write-Host "----- release notes for v$ver -----`n$notes"

      # Publish the GitHub Release and attach every artifact so anyone visiting
      # the repo can download them from the Releases page.
      #   * On a tag push, this CREATES the Release for the tag automatically.
      #   * On a UI release, it adds the assets to the existing Release.
      # The curated CHANGELOG section becomes the body; generate_release_notes
      # then appends an auto "Full Changelog" compare link beneath it.
      - name: Publish Release & attach assets
        if: ${{ github.event_name == 'push' || github.event_name == 'release' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: Glass.Message v${{ steps.ver.outputs.version }}
          body_path: release-notes.md
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            artifacts/*.nupkg
            artifacts/*.snupkg
            artifacts/*.zip
